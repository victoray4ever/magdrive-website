<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="skyM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b3c5d9"/>
      <stop offset="100%" stop-color="#d7e0ea"/>
    </linearGradient>
    <linearGradient id="groundM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#skyM)"/>
  <rect y="200" width="400" height="100" fill="url(#groundM)"/>
  <!-- Mountains -->
  <polygon points="0,200 80,100 160,200" fill="#6d4c41" opacity="0.6"/>
  <polygon points="100,200 200,80 300,200" fill="#5d4037" opacity="0.7"/>
  <polygon points="250,200 330,120 400,200" fill="#6d4c41" opacity="0.5"/>
  <!-- Excavator -->
  <rect x="140" y="180" width="80" height="40" fill="#ffc107" stroke="#f57f17" stroke-width="2" rx="4"/>
  <rect x="155" y="155" width="50" height="30" fill="#ffc107" stroke="#f57f17" stroke-width="2" rx="3"/>
  <rect x="165" y="135" width="30" height="25" fill="#37474f" rx="2"/>
  <!-- Arm -->
  <line x1="180" y1="155" x2="260" y2="175" stroke="#f57f17" stroke-width="8" stroke-linecap="round"/>
  <line x1="260" y1="175" x2="280" y2="220" stroke="#f57f17" stroke-width="8" stroke-linecap="round"/>
  <!-- Bucket -->
  <path d="M 270 220 L 295 215 L 300 240 L 275 245 Z" fill="#f57f17" stroke="#e65100" stroke-width="2"/>
  <!-- Wheels -->
  <circle cx="155" cy="225" r="12" fill="#37474f" stroke="#263238" stroke-width="2"/>
  <circle cx="205" cy="225" r="12" fill="#37474f" stroke="#263238" stroke-width="2"/>
  <!-- Conveyor belt -->
  <rect x="290" y="195" width="80" height="8" fill="#78909c" rx="2"/>
  <circle cx="295" cy="199" r="6" fill="#546e7a"/>
  <circle cx="365" cy="199" r="6" fill="#546e7a"/>
  <!-- Dust particles -->
  <circle cx="250" cy="200" r="3" fill="#d7ccc8" opacity="0.5"/>
  <circle cx="270" cy="195" r="2" fill="#d7ccc8" opacity="0.4"/>
  <circle cx="240" cy="205" r="2.5" fill="#d7ccc8" opacity="0.5"/>
  <text x="200" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="bold">矿山机械</text>
</svg>
