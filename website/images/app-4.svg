<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="roadA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#607d8b"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="180" fill="#e3f2fd"/>
  <!-- Road -->
  <polygon points="100,300 300,300 220,180 180,180" fill="url(#roadA)"/>
  <!-- Road lines -->
  <line x1="200" y1="185" x2="200" y2="295" stroke="#ffffff" stroke-width="3" stroke-dasharray="15,10"/>
  <!-- Car body -->
  <rect x="130" y="120" width="140" height="50" rx="15" fill="#e53935" stroke="#c62828" stroke-width="2"/>
  <!-- Car roof -->
  <path d="M 155 120 L 175 90 L 225 90 L 245 120 Z" fill="#d32f2f" stroke="#c62828" stroke-width="2"/>
  <!-- Windows -->
  <path d="M 160 118 L 178 95 L 198 95 L 198 118 Z" fill="#b3e5fc" stroke="#0288d1" stroke-width="1.5"/>
  <path d="M 202 95 L 222 95 L 240 118 L 202 118 Z" fill="#b3e5fc" stroke="#0288d1" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="160" cy="172" r="18" fill="#212121"/>
  <circle cx="160" cy="172" r="10" fill="#424242"/>
  <circle cx="160" cy="172" r="5" fill="#757575"/>
  <circle cx="240" cy="172" r="18" fill="#212121"/>
  <circle cx="240" cy="172" r="10" fill="#424242"/>
  <circle cx="240" cy="172" r="5" fill="#757575"/>
  <!-- Headlight -->
  <circle cx="265" cy="135" r="6" fill="#fff59d" stroke="#f9a825" stroke-width="1"/>
  <!-- Motion lines -->
  <line x1="80" y1="135" x2="110" y2="135" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="150" x2="105" y2="150" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="80" y1="165" x2="110" y2="165" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <!-- Ground -->
  <rect y="180" width="400" height="120" fill="#cfd8dc"/>
  <text x="200" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#37474f" font-weight="bold">汽车制造</text>
</svg>
