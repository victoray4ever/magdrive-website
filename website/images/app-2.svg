<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="skyW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#b3e5fc"/>
    </linearGradient>
    <linearGradient id="grassW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#skyW)"/>
  <rect y="220" width="400" height="80" fill="url(#grassW)"/>
  <!-- Sun -->
  <circle cx="60" cy="50" r="20" fill="#fff59d" opacity="0.8"/>
  <!-- Wind turbine tower -->
  <polygon points="195,260 205,260 200,80" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1"/>
  <!-- Nacelle -->
  <ellipse cx="200" cy="80" rx="15" ry="8" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1.5"/>
  <!-- Blades -->
  <g transform="translate(200,80)">
    <path d="M 0 0 L -8 -60 L 0 -65 L 4 -60 L 0 0 Z" fill="#eceff1" stroke="#cfd8dc" stroke-width="1"/>
    <path d="M 0 0 L 52 -30 L 56 -24 L 2 -5 L 0 0 Z" fill="#eceff1" stroke="#cfd8dc" stroke-width="1" transform="rotate(120)"/>
    <path d="M 0 0 L 52 -30 L 56 -24 L 2 -5 L 0 0 Z" fill="#eceff1" stroke="#cfd8dc" stroke-width="1" transform="rotate(240)"/>
  </g>
  <!-- Second smaller turbine -->
  <polygon points="100,250 105,250 102.5,170" fill="#bdbdbd" stroke="#9e9e9e" stroke-width="0.5"/>
  <ellipse cx="102.5" cy="170" rx="8" ry="4" fill="#cfd8dc"/>
  <g transform="translate(102.5,170)">
    <path d="M 0 0 L -4 -30 L 0 -32 L 2 -30 L 0 0 Z" fill="#e0e0e0"/>
    <path d="M 0 0 L 26 -15 L 28 -12 L 1 -2 L 0 0 Z" fill="#e0e0e0" transform="rotate(120)"/>
    <path d="M 0 0 L 26 -15 L 28 -12 L 1 -2 L 0 0 Z" fill="#e0e0e0" transform="rotate(240)"/>
  </g>
  <!-- Third turbine -->
  <polygon points="310,250 315,250 312.5,190" fill="#bdbdbd" stroke="#9e9e9e" stroke-width="0.5"/>
  <ellipse cx="312.5" cy="190" rx="6" ry="3" fill="#cfd8dc"/>
  <g transform="translate(312.5,190)">
    <path d="M 0 0 L -3 -22 L 0 -24 L 1.5 -22 L 0 0 Z" fill="#e0e0e0"/>
    <path d="M 0 0 L 19 -11 L 21 -9 L 0.5 -1 L 0 0 Z" fill="#e0e0e0" transform="rotate(120)"/>
    <path d="M 0 0 L 19 -11 L 21 -9 L 0.5 -1 L 0 0 Z" fill="#e0e0e0" transform="rotate(240)"/>
  </g>
  <!-- Wind lines -->
  <path d="M 20 100 Q 60 95 100 100" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  <path d="M 20 120 Q 60 115 90 120" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <path d="M 20 140 Q 50 135 80 140" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <text x="200" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="bold">风力发电</text>
</svg>
