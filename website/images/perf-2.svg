<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <rect width="500" height="320" fill="#ffffff"/>
  <!-- Chart area -->
  <rect x="60" y="30" width="400" height="230" fill="#f8fafc" stroke="#cfd8dc" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="60" y1="80" x2="460" y2="80" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="60" y1="130" x2="460" y2="130" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="60" y1="180" x2="460" y2="180" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Axes -->
  <line x1="60" y1="260" x2="460" y2="260" stroke="#37474f" stroke-width="2"/>
  <line x1="60" y1="30" x2="60" y2="260" stroke="#37474f" stroke-width="2"/>
  <!-- L10 curve (log scale) -->
  <path d="M 60 240 C 120 200 180 160 240 110 C 300 70 360 50 460 40" fill="none" stroke="#1565c0" stroke-width="3"/>
  <!-- Fill area under curve -->
  <path d="M 60 240 C 120 200 180 160 240 110 C 300 70 360 50 460 40 L 460 260 L 60 260 Z" fill="#1565c0" fill-opacity="0.1"/>
  <!-- Data points -->
  <circle cx="120" cy="205" r="4" fill="#1565c0"/>
  <circle cx="200" cy="145" r="4" fill="#1565c0"/>
  <circle cx="280" cy="90" r="4" fill="#1565c0"/>
  <circle cx="360" cy="55" r="4" fill="#1565c0"/>
  <!-- Labels for data points -->
  <text x="120" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1565c0">10h</text>
  <text x="200" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1565c0">100h</text>
  <text x="280" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1565c0">1000h</text>
  <text x="360" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1565c0">10000h</text>
  <!-- X-axis labels -->
  <text x="60" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">10</text>
  <text x="160" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">100</text>
  <text x="260" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">1000</text>
  <text x="360" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">10^4</text>
  <text x="460" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">10^5</text>
  <text x="260" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#37474f" font-weight="bold">寿命 (h)</text>
  <!-- Y-axis labels -->
  <text x="50" y="265" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">50%</text>
  <text x="50" y="215" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">70%</text>
  <text x="50" y="165" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">85%</text>
  <text x="50" y="115" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">95%</text>
  <text x="50" y="65" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">99%</text>
  <text x="20" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#37474f" font-weight="bold" transform="rotate(-90 20 145)">可靠度</text>
  <!-- Title -->
  <text x="260" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#37474f" font-weight="bold">疲劳寿命曲线 (L10)</text>
</svg>
