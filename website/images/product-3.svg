<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f0f8"/>
      <stop offset="100%" stop-color="#c5d5e5"/>
    </radialGradient>
    <radialGradient id="ring3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="60%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </radialGradient>
    <radialGradient id="ball3" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cfd8dc"/>
      <stop offset="100%" stop-color="#78909c"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <!-- Bottom plate -->
  <ellipse cx="200" cy="180" rx="110" ry="25" fill="url(#ring3)" stroke="#37474f" stroke-width="2"/>
  <!-- Top plate -->
  <ellipse cx="200" cy="120" rx="110" ry="25" fill="url(#ring3)" stroke="#37474f" stroke-width="2"/>
  <!-- Side walls -->
  <path d="M 90 120 L 90 180" stroke="#37474f" stroke-width="2" fill="none"/>
  <path d="M 310 120 L 310 180" stroke="#37474f" stroke-width="2" fill="none"/>
  <!-- Balls between plates -->
  <circle cx="130" cy="150" r="15" fill="url(#ball3)" stroke="#546e7a" stroke-width="1"/>
  <circle cx="170" cy="150" r="15" fill="url(#ball3)" stroke="#546e7a" stroke-width="1"/>
  <circle cx="200" cy="150" r="15" fill="url(#ball3)" stroke="#546e7a" stroke-width="1"/>
  <circle cx="230" cy="150" r="15" fill="url(#ball3)" stroke="#546e7a" stroke-width="1"/>
  <circle cx="270" cy="150" r="15" fill="url(#ball3)" stroke="#546e7a" stroke-width="1"/>
  <!-- Arrows showing axial load -->
  <line x1="200" y1="80" x2="200" y2="105" stroke="#e53935" stroke-width="3" marker-end="url(#arrow3)"/>
  <line x1="200" y1="220" x2="200" y2="195" stroke="#e53935" stroke-width="3" marker-end="url(#arrow3d)"/>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e53935"/>
    </marker>
    <marker id="arrow3d" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e53935"/>
    </marker>
  </defs>
  <text x="200" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#e53935">轴向载荷</text>
  <text x="200" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#37474f" font-weight="bold">推力球轴承</text>
</svg>
