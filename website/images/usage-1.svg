<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <rect width="500" height="320" fill="#ffffff"/>
  <text x="250" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#37474f" font-weight="bold">轴承安装步骤指引</text>
  <!-- Step 1 -->
  <rect x="20" y="45" width="135" height="120" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <circle cx="87" cy="75" r="15" fill="#1976d2"/>
  <text x="87" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="bold">1</text>
  <text x="87" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#1565c0" font-weight="bold">清洁检查</text>
  <text x="87" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#546e7a">清洁轴和座孔</text>
  <text x="87" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#546e7a">检查尺寸公差</text>
  <!-- Arrow -->
  <line x1="160" y1="105" x2="180" y2="105" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrowS1)"/>
  <!-- Step 2 -->
  <rect x="185" y="45" width="135" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="252" cy="75" r="15" fill="#2e7d32"/>
  <text x="252" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="bold">2</text>
  <text x="252" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#1b5e20" font-weight="bold">加热安装</text>
  <text x="252" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#546e7a">加热至80-100C</text>
  <text x="252" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#546e7a">热装至轴上</text>
  <!-- Arrow -->
  <line x1="325" y1="105" x2="345" y2="105" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrowS1)"/>
  <!-- Step 3 -->
  <rect x="350" y="45" width="135" height="120" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <circle cx="417" cy="75" r="15" fill="#e65100"/>
  <text x="417" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="bold">3</text>
  <text x="417" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bf360c" font-weight="bold">固定定位</text>
  <text x="417" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#546e7a">锁紧螺母</text>
  <text x="417" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#546e7a">检查轴向间隙</text>
  <!-- Bottom row -->
  <!-- Step 4 -->
  <rect x="105" y="185" width="135" height="120" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <circle cx="172" cy="215" r="15" fill="#7b1fa2"/>
  <text x="172" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="bold">4</text>
  <text x="172" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#4a148c" font-weight="bold">润滑填充</text>
  <text x="172" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#546e7a">填充润滑脂</text>
  <text x="172" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#546e7a">填充量1/2-2/3</text>
  <!-- Arrow up -->
  <line x1="172" y1="180" x2="172" y2="170" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrowS1u)"/>
  <!-- Step 5 -->
  <rect x="270" y="185" width="135" height="120" rx="8" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <circle cx="337" cy="215" r="15" fill="#00838f"/>
  <text x="337" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="bold">5</text>
  <text x="337" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#006064" font-weight="bold">试运行</text>
  <text x="337" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#546e7a">低速试运转</text>
  <text x="337" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#546e7a">检查温升噪音</text>
  <!-- Arrow left -->
  <line x1="270" y1="245" x2="250" y2="245" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrowS1l)"/>
  <defs>
    <marker id="arrowS1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#90a4ae"/>
    </marker>
    <marker id="arrowS1u" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M 0 8 L 4 0 L 8 8 z" fill="#90a4ae"/>
    </marker>
    <marker id="arrowS1l" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
