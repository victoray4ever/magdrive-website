<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f0f8"/>
      <stop offset="100%" stop-color="#c5d5e5"/>
    </radialGradient>
    <radialGradient id="metal1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="40%" stop-color="#b0bec5"/>
      <stop offset="80%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </radialGradient>
    <radialGradient id="ball1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cfd8dc"/>
      <stop offset="100%" stop-color="#78909c"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg1)"/>
  <!-- Outer ring -->
  <circle cx="200" cy="150" r="100" fill="url(#metal1)" stroke="#37474f" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="200" cy="150" r="55" fill="url(#metal1)" stroke="#37474f" stroke-width="2"/>
  <!-- Balls -->
  <circle cx="200" cy="78" r="18" fill="url(#ball1)" stroke="#546e7a" stroke-width="1"/>
  <circle cx="262" cy="114" r="18" fill="url(#ball1)" stroke="#546e7a" stroke-width="1"/>
  <circle cx="262" cy="186" r="18" fill="url(#ball1)" stroke="#546e7a" stroke-width="1"/>
  <circle cx="200" cy="222" r="18" fill="url(#ball1)" stroke="#546e7a" stroke-width="1"/>
  <circle cx="138" cy="186" r="18" fill="url(#ball1)" stroke="#546e7a" stroke-width="1"/>
  <circle cx="138" cy="114" r="18" fill="url(#ball1)" stroke="#546e7a" stroke-width="1"/>
  <!-- Center hole -->
  <circle cx="200" cy="150" r="40" fill="#263238"/>
  <circle cx="200" cy="150" r="35" fill="#1a2329"/>
  <!-- Label -->
  <text x="200" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#37474f" font-weight="bold">深沟球轴承</text>
</svg>
