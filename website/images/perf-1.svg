<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <rect width="500" height="320" fill="#ffffff"/>
  <!-- Chart area -->
  <rect x="60" y="30" width="400" height="230" fill="#f8fafc" stroke="#cfd8dc" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="60" y1="80" x2="460" y2="80" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="60" y1="130" x2="460" y2="130" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="60" y1="180" x2="460" y2="180" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Axes -->
  <line x1="60" y1="260" x2="460" y2="260" stroke="#37474f" stroke-width="2"/>
  <line x1="60" y1="30" x2="60" y2="260" stroke="#37474f" stroke-width="2"/>
  <!-- Curve 1: Deep groove ball bearing (red) -->
  <path d="M 60 80 Q 150 85 200 110 Q 280 140 340 200 Q 400 240 460 255" fill="none" stroke="#e53935" stroke-width="3"/>
  <text x="420" y="245" font-family="Arial,sans-serif" font-size="10" fill="#e53935">深沟球</text>
  <!-- Curve 2: Tapered roller (blue) -->
  <path d="M 60 100 Q 150 105 200 125 Q 280 155 340 210 Q 400 245 460 258" fill="none" stroke="#1976d2" stroke-width="3"/>
  <text x="420" y="230" font-family="Arial,sans-serif" font-size="10" fill="#1976d2">圆锥滚子</text>
  <!-- Curve 3: Thrust bearing (green) -->
  <path d="M 60 130 Q 150 135 200 155 Q 280 180 340 225 Q 400 250 460 259" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <text x="420" y="215" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">推力球</text>
  <!-- X-axis labels -->
  <text x="60" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">0</text>
  <text x="160" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">2000</text>
  <text x="260" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">4000</text>
  <text x="360" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">6000</text>
  <text x="460" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">8000</text>
  <text x="260" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#37474f" font-weight="bold">转速 (r/min)</text>
  <!-- Y-axis labels -->
  <text x="50" y="265" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">0</text>
  <text x="50" y="215" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">5</text>
  <text x="50" y="165" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">10</text>
  <text x="50" y="115" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">15</text>
  <text x="50" y="65" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#546e7a">20</text>
  <text x="20" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#37474f" font-weight="bold" transform="rotate(-90 20 145)">载荷 (kN)</text>
  <!-- Title -->
  <text x="260" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#37474f" font-weight="bold">载荷-转速特性曲线</text>
</svg>
