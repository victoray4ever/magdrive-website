# MagDrive 公司官网 Nginx 配置 (基于独立二级域名共享 443 端口)
# 例如: magdrive.yourdomain.com 或 company.yourdomain.com

server {
    listen 80;
    server_name magdrive.yourdomain.com;  # 请替换为您的公司网站域名
    return 301 https://;
}

server {
    listen 443 ssl http2;
    server_name magdrive.yourdomain.com;  # 请替换为您的公司网站域名

    # SSL 证书配置 (可使用 certbot --nginx 自动签发)
    # ssl_certificate /etc/letsencrypt/live/magdrive.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/magdrive.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 客户端上传文件大小限制 (支持图片上传)
    client_max_body_size 20M;

    # 反向代理到 Python 本地服务 (或者直接作为静态站点)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host ;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
    }
}
